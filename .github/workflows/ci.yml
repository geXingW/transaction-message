name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:
    branches: [master, "release/**"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "17"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # 项目无根 aggregator pom，按依赖顺序顺序构建：
      #   spring-transaction-message          (基础库，被下游依赖)
      #   spring-transaction-message-rabbitmq (依赖基础库)
      #   spring-transaction-message-example  (聚合 pom，依赖前两者)
      - name: Build spring-transaction-message
        run: mvn -B -ntp -f spring-transaction-message/pom.xml clean install -DskipTests=false

      - name: Build spring-transaction-message-rabbitmq
        run: mvn -B -ntp -f spring-transaction-message-rabbitmq/pom.xml clean install -DskipTests=false

      - name: Build spring-transaction-message-example
        run: mvn -B -ntp -f spring-transaction-message-example/pom.xml clean verify -DskipTests=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
          retention-days: 7

  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Check formatting
        run: |
          # 占位：后续接入 spotless / checkstyle
          echo "Lint placeholder - to be configured in Phase 1"

  commit-lint:
    name: Commit Message
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .github/commitlint.config.cjs
