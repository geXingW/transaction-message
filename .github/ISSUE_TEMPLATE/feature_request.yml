name: ✨ Feature Request
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 描述你遇到的场景或痛点
      placeholder: 例如：希望支持 HTTP Executor，可以可靠地调用第三方 webhook
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望的实现方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 还考虑过哪些方案？为什么没选？

  - type: dropdown
    id: phase
    attributes:
      label: 优先级 / 阶段
      options:
        - P0 - 阻塞当前版本
        - P1 - 重要，应纳入下个 minor
        - P2 - 锦上添花
        - 未确定

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 截图、文档链接、参考资料

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已经搜索过现有 Issue 和 ROADMAP，没有重复
          required: true
